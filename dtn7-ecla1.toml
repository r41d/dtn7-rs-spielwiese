nodeid = "node1"
debug = true
beacon-period = true
generate-status-reports = false
parallel-bundle-processing = false
webport = 4001
workdir = "/tmp/dtn7-ecla1"
db = "mem"

[routing]
strategy = "epidemic"

[core]
janitor = "10s"

[discovery]
interval = "90s"
peer-timeout = "300s"

[endpoints]
# local endpoints are always reachable under dtn://<nodeid>/<localname>
local.0 = "incoming"
local.1 = "null"

[ecla]
enabled  = true
tcp_port = 0
